name: Package Skills

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-skills.yml'
      - '*/**'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build zip archives
        run: |
          mkdir -p dist
          for skill_dir in */; do
            skill="${skill_dir%/}"
            if [ -f "$skill/SKILL.md" ]; then
              zip -r "dist/${skill}.zip" "$skill/"
              echo "Packaged $skill"
            fi
          done

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="skills-latest"
          TITLE="Latest skill packages"
          NOTES="Auto-generated skill archives from commit ${{ github.sha }}."

          # Delete existing release if present, then recreate
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          gh release create "$TAG" dist/*.zip \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest
